# Nginx reverse proxy for ParcelMoover, forwarding to the app container
# bound to 127.0.0.1:3000 (see deploy/docker-compose.prod.yml).
#
# This starts as plain HTTP on purpose: `certbot --nginx -d ... --redirect`
# detects this server block, obtains the cert, and rewrites this file in
# place to add the 443/SSL block plus the 80->443 redirect, carrying these
# same locations over. Don't hand-add an SSL server block before that —
# nginx refuses to start pointing at certificate files that don't exist yet.
#
# 2026-08-02: Cloudflare in front of this host is set to "Flexible" SSL mode,
# which connects to this origin over plain HTTP. The old 80->443 redirect
# below sent Cloudflare's own HTTP request right back to itself as a
# redirect, forever (ERR_TOO_MANY_REDIRECTS for every visitor). Fixed by
# serving the app on port 80 directly instead of redirecting — browsers
# still get HTTPS from Cloudflare's edge either way, so this isn't a
# regression for them. Whoever has Cloudflare dashboard access should switch
# SSL/TLS mode to Full (strict) (this origin already has a valid Let's
# Encrypt cert) — once that's done, port 80 can safely redirect again.

server {
    server_name 13.61.57.104.sslip.io portal.parcelmoover.com;

    client_max_body_size 10m;

    listen 80;
    listen [::]:80;

    # Long-lived Server-Sent-Events stream (server/src/controllers/notification.controller.ts).
    # Buffering here would hold every event in an Nginx buffer instead of
    # flushing it to the client immediately, defeating the point of SSE.
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite-hashed assets — safe to long-cache
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # A PWA only learns about a new release by rechecking these files. Never
    # allow an intermediary cache to keep the old Rider service worker alive.
    location = /rider/sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /rider/registerSW.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rider Vite assets are content-hashed, so long caching is safe once the
    # service worker has fetched the current manifest and shell.
    location ^~ /rider/assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Multipart uploads (vendor registration, KYC docs) can take >60s
        # to compress+encrypt. Match the client-side 120s timeout.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/13.61.57.104.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/13.61.57.104.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
